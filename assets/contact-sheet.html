<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
 body{margin:0;font-family:var(--cw-font-sans);background:var(--cw-v2-color-sidewalk)}
 .row{display:flex;align-items:center;gap:28px;padding:18px 28px;border-bottom:1px solid var(--cw-v2-color-border)}
 .lbl{font-family:var(--cw-font-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--cw-v2-color-text-caption);width:230px}
 .dark{background:var(--cw-v2-color-ink)} .coralbg{background:var(--cw-v2-color-primary)}
 img{display:block} .band{height:14px;width:520px;background:var(--cw-band);border-radius:2px}
 .sw{display:flex;gap:4px} .sw i{width:38px;height:38px;border-radius:8px;display:block}
</style></head><body>
<div class="row"><span class="lbl">wordmark ink</span><img src="cakewalk-wordmark-ink.svg" height="34"></div>
<div class="row"><span class="lbl">wordmark coral</span><img src="cakewalk-wordmark-coral.svg" height="34"></div>
<div class="row dark"><span class="lbl" style="color:#9292A3">wordmark white</span><img src="cakewalk-wordmark-white.svg" height="34"></div>
<div class="row"><span class="lbl">mark ink / coral</span><img src="cakewalk-mark-ink.svg" height="52"><img src="cakewalk-mark-coral.svg" height="52"></div>
<div class="row coralbg"><span class="lbl" style="color:#F8D5CE">mark white on coral</span><img src="cakewalk-mark-white.svg" height="52"></div>
<div class="row"><span class="lbl">spectrum band</span><div class="band"></div></div>
<div class="row"><span class="lbl">core swatches</span><div class="sw">
 <i style="background:var(--cw-v2-color-ink)"></i><i style="background:var(--cw-v2-color-sidewalk)"></i>
 <i style="background:var(--cw-v2-color-cream)"></i><i style="background:var(--cw-v2-color-warm-blush)"></i>
 <i style="background:var(--cw-v2-color-primary)"></i><i style="background:var(--cw-v2-color-accent)"></i>
 <i style="background:var(--cw-v2-color-band-mint)"></i><i style="background:var(--cw-v2-color-sunny)"></i>
 <i style="background:var(--cw-v2-color-success)"></i><i style="background:var(--cw-v2-color-band-purple)"></i></div></div>
<div class="row"><span class="lbl">type ramp</span><div>
 <div class="cw-slide-action-title">Action title, Bold 48</div>
 <div class="cw-slide-overline" style="color:var(--cw-v2-color-primary)">Overline · mono +12%</div>
 <div class="cw-slide-body-small">Body small, Regular 21 — the workhorse.</div>
 <div class="cw-slide-data">Data · mono 19 · 2026-03-14</div></div></div>
</body></html>
